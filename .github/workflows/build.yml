name: Build and release SRPM

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:40

    steps:
      - name: Install prerequisites
        run: dnf install -y git rpm-build rpmdevtools dnf-plugins-core gzip

      - name: Checkout nagios-rpm
        uses: actions/checkout@v4
        with:
          path: nagios-rpm

      - name: Checkout nagioscore
        uses: actions/checkout@v4
        with:
          repository: kuriyama/nagioscore
          path: nagios-rpm/nagioscore

      - name: Pin nagioscore to the ref/commit recorded in sources
        working-directory: nagios-rpm/nagioscore
        run: |
          set -e
          # "# source: .../nagioscore @ <ref> (<40-hex commit>)" という行から
          # ref名とコミットの両方を読む。
          #
          # コミットではなく ref 名の方を shallow fetch すると、sources
          # 生成後に nagioscore 側へさらに commit が push されて ref の
          # 指す先が進んでしまっていた場合、shallow fetch は新しい方の
          # tip しか取得せず、sources が指す一つ前のコミットの tree が
          # ローカルに存在しない状態になり "unable to read tree" で失敗
          # する(このリポジトリと nagioscore 側の push タイミングが
          # ずれると起き得る、実際に発生した障害)。
          #
          # そのため ref ではなくコミットハッシュそのものを直接 fetch
          # する。GitHub は到達可能な任意の SHA1 を want として受け付ける
          # ため、ref がどれだけ進んでいても対象コミットだけを確実に
          # 取得できる。
          line=$(grep '^# source:' ../sources)
          ref=$(printf '%s\n' "$line" | sed -E 's/.*@ ([^ ]+) \(.*/\1/')
          commit=$(printf '%s\n' "$line" | grep -oE '\(([0-9a-f]{40})\)' | tr -d '()')
          echo "Fetching commit $commit (recorded ref: $ref)"
          git remote set-branches origin '*'
          git fetch --depth 1 origin "$commit"
          # detached HEAD ではなく "$ref" という名前のローカルブランチを
          # 作る。generate-source-tarball.sh はデフォルト ref として
          # ブランチ名 (al2023-<version>) をそのまま解決しにいくため。
          git checkout -B "$ref" FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$commit" ] || {
            echo "error: HEAD ($(git rev-parse HEAD)) != expected commit ($commit)" >&2
            exit 1
          }

      - name: Generate source tarball
        working-directory: nagios-rpm
        run: |
          set -e
          ./scripts/generate-source-tarball.sh
          # sources のハッシュがローカルでコミットされたものと一致することを確認する
          # (nagioscore 側の ref がずれていたり sources を手で書き換えていないかの検証)
          git diff --exit-code sources

      - name: Build SRPM
        working-directory: nagios-rpm
        run: |
          set -e
          mkdir -p out
          rpmbuild -bs nagios.spec \
            --define "_sourcedir $PWD" \
            --define "_specdir $PWD" \
            --define "_srcrpmdir $PWD/out" \
            --define "_vendor amazon" \
            --define "dist .amzn2023"

      - name: Install build dependencies
        working-directory: nagios-rpm
        run: dnf builddep -y out/*.src.rpm

      - name: Full build (validation)
        working-directory: nagios-rpm
        run: |
          set -e
          mkdir -p out
          rpmbuild --rebuild out/*.src.rpm \
            --define "_rpmdir $PWD/out" \
            --define "_vendor amazon" \
            --define "dist .amzn2023"

      - name: Determine version-release
        id: relver
        working-directory: nagios-rpm
        run: |
          set -e
          v=$(rpm -q --qf '%{version}-%{release}\n' -p out/*.src.rpm)
          echo "tag=$v" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.relver.outputs.tag }}
          files: |
            nagios-rpm/out/*.src.rpm
            nagios-rpm/out/*/*.rpm
